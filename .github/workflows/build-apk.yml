name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore project archive
        run: |
          set -euo pipefail
          rm -f project.tar.bz2
          cat PdfNotesApp_tablet.part1.b64 PdfNotesApp_tablet.part2.b64 PdfNotesApp_tablet.part3.b64 > project.tar.bz2
          file project.tar.bz2
          tar -tjf project.tar.bz2 >/dev/null
          mkdir -p unpacked
          tar -xjf project.tar.bz2 -C unpacked
          PROJECT_DIR=$(find unpacked -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Patch Kotlin compile errors
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/pdfnotes/app/ui/documents/DocumentListScreen.kt')
          s = p.read_text()
          if 'import androidx.compose.foundation.lazy.grid.items' not in s:
              s = s.replace('import androidx.compose.foundation.lazy.grid.LazyVerticalGrid\n', 'import androidx.compose.foundation.lazy.grid.LazyVerticalGrid\nimport androidx.compose.foundation.lazy.grid.items\n')
          s = s.replace('items(filtered, key = { it.id }) { doc -> DocumentCard(doc, onOpenDocument) }', 'items(filtered.size, key = { index -> filtered[index].id }) { index -> DocumentCard(filtered[index], onOpenDocument) }')
          p.write_text(s)

          p = Path('app/src/main/java/com/pdfnotes/app/ui/navigation/AppNavHost.kt')
          s = p.read_text()
          if 'import androidx.compose.foundation.layout.Spacer' not in s:
              s = s.replace('import androidx.compose.foundation.layout.Row\n', 'import androidx.compose.foundation.layout.Row\nimport androidx.compose.foundation.layout.Spacer\nimport androidx.compose.foundation.layout.padding\n')
          if 'import androidx.compose.runtime.collectAsState' not in s:
              s = s.replace('import androidx.compose.runtime.Composable\n', 'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.collectAsState\n')
          s = s.replace('Spacer(androidx.compose.foundation.layout.Spacer(Modifier.weight(1f)))', 'Spacer(Modifier.weight(1f))')
          p.write_text(s)

          p = Path('app/src/main/java/com/pdfnotes/app/ui/notes/NotesScreen.kt')
          s = p.read_text()
          if 'import androidx.compose.foundation.clickable' not in s:
              s = s.replace('import androidx.compose.foundation.layout.*\n', 'import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.clickable\n')
          s = s.replace('modifier = Modifier.fillMaxWidth(), colors = ListItemDefaults.colors(containerColor = if (selected?.id == doc.id) MaterialTheme.colorScheme.primaryContainer else MaterialTheme.colorScheme.surface)) { selected = doc }', 'modifier = Modifier.fillMaxWidth().clickable { selected = doc }, colors = ListItemDefaults.colors(containerColor = if (selected?.id == doc.id) MaterialTheme.colorScheme.primaryContainer else MaterialTheme.colorScheme.surface))')
          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfNotesApp-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
